name: pipeline
on:
    push:
        branches:
        - main 
        - feature/*
        paths:
        - 'Kubernetes/Chapter-4 Cloud/GitHub Actions-Pipeline/**'
# ghcr these permissions are explicilty defined
permissions:
  contents: read
  packages: write
jobs:
   build:
        runs-on: ${{ matrix.operating_system }}
        strategy:
            matrix:
               operating_system: [ ubuntu-latest]
        steps:
        -  name: checkout
           uses:  actions/checkout@v6
        - name: Docker Login
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            #login into github container registry for pushing image to ghcr also
        - name: GHCR Login
          uses: docker/login-action@v3
          with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GITHUB_TOKEN }} # GitHub automatically provides a built-in cryptographic token called secrets.GITHUB_TOKEN for every workflow run

        - name: Build and push
          uses: docker/build-push-action@v5
          with:
            # by default workflow looks for Dockerfile in root directory ,but to point fike in my pjt folder 
            context: "./Kubernetes/Chapter-4 Cloud/GitHub Actions-Pipeline"
            file: "./Kubernetes/Chapter-4 Cloud/GitHub Actions-Pipeline/Dockerfile"
            push: true
            tags: | 
                 ${{vars.DOCKER_USERNAME}}/projects:${{github.sha}}
                # ghcr.io/${{vars.DOCKER_USERNAME}}/projects:${{github.sha}}
## Next Login into azure portal ,give necessary access permission

   deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: "rg1"
        cluster-name: "myAKSCluster"
    # 1. Update the image tag in kustomization.yaml
    - name: Update image tag
      run: |
        cd "Kubernetes/Chapter-4 Cloud/GitHub Actions-Pipeline"
        kustomize edit set image <your-image-name>=${{ vars.DOCKER_USERNAME }}/projects:${{ github.sha }}
    # - name: Deploy manifests
    #   uses: azure/k8s-deploy@v4
    #   with:
    #     manifests: |
    #       k8s/deployment.yaml
    #       k8s/service.yaml
    # 2. Render the final manifests using kustomize
    - name: Build Kustomize manifests
      run: |
        kustomize build "Kubernetes/Chapter-4 Cloud/GitHub Actions-Pipeline" > compiled-manifests.yaml
    - name: Deploy using Kustomize
      uses: azure/k8s-deploy@v4
      with:
        action: deploy
        manifests: |
          compiled-manifests.yaml


